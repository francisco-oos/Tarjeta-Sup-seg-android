import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localSecrets = new Properties()
def secretsFile = rootProject.file('supervision-secrets.properties')
if (secretsFile.exists()) {
    secretsFile.withInputStream { localSecrets.load(it) }
}

def readLocalValue = { String key, String fallback ->
    def envValue = System.getenv(key)?.trim()
    if (envValue) return envValue
    def localValue = localSecrets.getProperty(key, fallback)?.trim()
    return localValue ?: fallback
}

def quoted = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'com.sinopec.supervisionsegura'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.sinopec.supervisionsegura'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'

        // La clave real vive fuera de Git: variable de entorno o
        // supervision-secrets.properties (ignorado por Git).
        buildConfigField "String", "DATA_KEY",
                quoted(readLocalValue(
                        "SUPERVISION_SEGURA_DATA_KEY",
                        "CHANGE_ME_SUPERVISION_SEGURA_DATA_KEY"
                ))
        buildConfigField "String", "LOCAL_EXPIRES_AT", "\"2026-07-30\""
        buildConfigField "String", "VERSION_CONTROL_URL", "\"\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.google.zxing:core:3.5.3'
}
