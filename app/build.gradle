plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sinopec.supervisionsegura'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.sinopec.supervisionsegura'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'

        buildConfigField "String", "DATA_KEY", "\"CAMBIA_ESTA_CLAVE_SUPERVISION_SEGURA_V1\""
        buildConfigField "String", "LOCAL_EXPIRES_AT", "\"2026-07-30\""
        buildConfigField "String", "VERSION_CONTROL_URL", "\"\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.google.zxing:core:3.5.3'
}
