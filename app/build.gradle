plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sinopec.supervisionsegura'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sinopec.supervisionsegura'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        // Control profesional de versión. Cambia esta fecha al compilar una nueva entrega.
        buildConfigField 'String', 'LOCAL_EXPIRES_AT', '"2026-12-31"'
        // Puedes dejarlo vacío por ahora. Después apuntará a tu archivo/servicio de control.
        buildConfigField 'String', 'VERSION_CONTROL_URL', '""'
        // Clave demo para cifrar JSON en AES/GCM. En producción la movemos a Keystore/licencia.
        buildConfigField 'String', 'DATA_KEY', '"CAMBIAR_ESTA_CLAVE_SUPERVISION_SEGURA_2026"'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'com.google.zxing:core:3.5.3'
}
